        "星期四": { label: "星期四", meat: "奇巧巧福大眾餐館", veg: "宏恩素食火鍋城" },
        "星期五": { label: "星期五", meat: "博虹港式燒臘便當", veg: "晨間朝食 Morning 蔬食餐飲連鎖" }
    }));

    function checkAdminPassword() {
        let password = prompt("請輸入管理者密碼：");
        if (password === "80724082") {
            toggleAdminPanel();
        } else if (password !== null) {
            alert("❌ 密碼錯誤，您沒有權限修改排程！");
        }
    }

    function toggleAdminPanel() {
        const panel = document.getElementById("adminPanel");
        panel.style.display = panel.style.display === "block" ? "none" : "block";
        if(panel.style.display === "block") {
            renderAdminConfig();
        }
    }

    function renderAdminConfig() {
        const container = document.getElementById("adminStoreConfig");
        let html = "";
        days.forEach(day => {
            let current = weeklySchedule[day];
            html += `<div style="margin-bottom: 12px; padding: 10px; background: #fff; border: 1px solid #ddd; border-radius: 6px;">
                <label>📅 顯示名稱/日期：</label><input type="text" id="admin_label_${day}" value="${current.label}" style="width: 140px;"> <br><br>
                <label>🥩 葷食店：</label><select id="admin_meat_${day}">`;
            meatStores.forEach(store => {
                let sel = (store === current.meat) ? "selected" : "";
                html += `<option value="${store}" ${sel}>${store}</option>`;
            });
            html += `</select> &nbsp;&nbsp;
                <label>🌱 素食店：</label><select id="admin_veg_${day}">`;
            vegStores.forEach(store => {
                let sel = (store === current.veg) ? "selected" : "";
                html += `<option value="${store}" ${sel}>${store}</option>`;
            });
            html += `</select></div>`;
        });
        container.innerHTML = html;
    }

    function saveAdminSchedule() {
        days.forEach(day => {
            weeklySchedule[day] = {
                label: document.getElementById(`admin_label_${day}`).value,
                meat: document.getElementById(`admin_meat_${day}`).value,
                veg: document.getElementById(`admin_veg_${day}`).value
            };
        });
        localStorage.setItem("lunch_schedule_v11", JSON.stringify(weeklySchedule));
        alert("🎉 本週排程與日期已更新！");
        toggleAdminPanel();
        initTable();
        renderSummary();
    }

    function initTable() {
        const tbody = document.getElementById("orderTableBody");
        const notice = document.getElementById("currentScheduleNotice");
        
        let noticeHtml = "<b>本週每日提供店家與日期：</b><br>";
        let scheduleDesc = [];
        days.forEach(day => {
            let info = weeklySchedule[day];
            scheduleDesc.push(`<b>${info.label}</b> ➔ 🥩 ${info.meat} ｜ 🌱 ${info.veg}`);
        });
        notice.innerHTML = noticeHtml + scheduleDesc.join("<br>");

        let html = "";
        days.forEach((day, index) => {
            let info = weeklySchedule[day];
            let noodleOptionsHtml = "";
            noodleOptions.forEach(n => {
                noodleOptionsHtml += `<option value="${n}">${n}</option>`;
            });

            html += `
                <tr>
                    <td><strong>${info.label}</strong></td>
                    <td>
                        <select id="type_${index}" onchange="updateStoreAndItems(${index})">
                            <option value="葷食">🥩 葷食</option>
                            <option value="素食">🌱 素食</option>
                        </select>
                    </td>
                    <td>
                        <span id="store_name_${index}" style="color: #2980b9; font-weight: bold;"></span>
                    </td>
                    <td>
                        <select id="item_${index}" onchange="updatePrice(${index})">
                            <!-- 動態載入 -->
                        </select>
                    </td>
                    <td>
                        <select id="noodle_${index}">
                            ${noodleOptionsHtml}
                        </select>
                    </td>
                    <td>
                        <input type="number" id="qty_${index}" value="1" min="1" style="width: 50px; text-align: center;" onchange="updatePrice(${index})">
                    </td>
                    <td>
                        <span id="price_${index}" style="font-weight:bold; color:#e74c3c;">0</span> 元
                    </td>
                    <td>
                        <input type="text" id="note_${index}" placeholder="例:半飯/雙拼" style="width: 90px;">
                    </td>
                    <td>
                        <button class="btn-danger" onclick="clearDay(${index})" type="button">取消</button>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;

        days.forEach((_, index) => {
            updateStoreAndItems(index);
        });
    }

    function updateStoreAndItems(dayIndex) {
        const type = document.getElementById(`type_${dayIndex}`).value;
        const storeNameSpan = document.getElementById(`store_name_${dayIndex}`);
        const itemSelect = document.getElementById(`item_${dayIndex}`);
        const day = days[dayIndex];
        
        let storeName = (type === "葷食") ? weeklySchedule[day].meat : weeklySchedule[day].veg;
        storeNameSpan.innerText = storeName;

        let storeObj = menuData[storeName];
        let itemOptions = "<option value=''>-- 請選擇品項 --</option>";
        for (let [itemName, price] of Object.entries(storeObj.items)) {
            itemOptions += `<option value="${itemName}" data-price="${price}">${itemName} ($${price})</option>`;
        }
        itemSelect.innerHTML = itemOptions;
        updatePrice(dayIndex);
    }

    function updatePrice(dayIndex) {
        const itemSelect = document.getElementById(`item_${dayIndex}`);
        const qtyInput = document.getElementById(`qty_${dayIndex}`);
        const priceSpan = document.getElementById(`price_${dayIndex}`);
        const selectedOption = itemSelect.options[itemSelect.selectedIndex];
        
        if (selectedOption && selectedOption.dataset.price) {
            let unitPrice = parseInt(selectedOption.dataset.price);
            let qty = parseInt(qtyInput.value) || 1;
            priceSpan.innerText = unitPrice * qty;
        } else {
            priceSpan.innerText = "0";
        }
    }

    function clearDay(dayIndex) {
        document.getElementById(`item_${dayIndex}`).value = "";
        document.getElementById(`noodle_${dayIndex}`).selectedIndex = 0;
        document.getElementById(`qty_${dayIndex}`).value = "1";
        document.getElementById(`price_${dayIndex}`).innerText = "0";
        document.getElementById(`note_${dayIndex}`).value = "";
    }

    function saveMyOrder() {
        const name = document.getElementById("employeeName").value.trim();
        if (!name) {
            alert("請先輸入您的姓名！");
            return;
        }

        let userOrders = JSON.parse(localStorage.getItem("lunch_orders_v11") || "{}");
        let weeklySelection = {};

        days.forEach((day, index) => {
            let info = weeklySchedule[day];
            const type = document.getElementById(`type_${index}`).value;
            const storeName = document.getElementById(`store_name_${index}`).innerText;
            const itemName = document.getElementById(`item_${index}`).value;
            const noodle = document.getElementById(`noodle_${index}`).value;
            const qty = parseInt(document.getElementById(`qty_${index}`).value) || 1;
            const price = parseInt(document.getElementById(`price_${index}`).innerText);
            const note = document.getElementById(`note_${index}`).value.trim();

            if (itemName) {
                weeklySelection[day] = { dayLabel: info.label, storeName, type, itemName, noodle, qty, price, note };
            }
        });

        userOrders[name] = weeklySelection;
        localStorage.setItem("lunch_orders_v11", JSON.stringify(userOrders));
        
        alert("🎉 您的本週午餐點餐已成功儲存！");
        renderSummary();
    }

    function renderSummary() {
        const userOrders = JSON.parse(localStorage.getItem("lunch_orders_v11") || "{}");
        const summaryDiv = document.getElementById("summaryContent");
        
        let allUsers = Object.keys(userOrders);
        if (allUsers.length === 0) {
            summaryDiv.innerHTML = "目前尚無同仁送出點餐資料。";
            return;
        }

        let html = "";
        let grandTotalAll = 0;

        days.forEach(day => {
            let info = weeklySchedule[day];
            html += `<h4>📅 ${info.label} 訂餐統計</h4>`;
            let dayTotal = 0;
            let ordersByStore = {};

            allUsers.forEach(userName => {
                let order = userOrders[userName][day];
                if (order) {
                    let storeKey = `${order.type}：${order.storeName}`;
                    if (!ordersByStore[storeKey]) {
                        ordersByStore[storeKey] = {};
                    }
                    let noodleStr = (order.noodle && order.noodle !== "無(非麵食)") ? `[${order.noodle}]` : "";
                    let itemKey = order.itemName + noodleStr;
                    
                    if (!ordersByStore[storeKey][itemKey]) {
                        ordersByStore[storeKey][itemKey] = { totalQty: 0, unitPrice: order.price / order.qty, details: [] };
                    }
                    ordersByStore[storeKey][itemKey].totalQty += order.qty;
                    let extraInfo = [];
                    if(order.qty > 1) extraInfo.push(`${order.qty}份`);
                    if(order.note) extraInfo.push(order.note);
                    let infoStr = extraInfo.length > 0 ? `(${extraInfo.join(',')})` : "";
                    
                    ordersByStore[storeKey][itemKey].details.push(`${userName}${infoStr}`);
                    dayTotal += order.price;
                }
            });

            if (Object.keys(ordersByStore).length === 0) {
                html += `<p style="color:#888; font-size:13px;">當日無人點餐</p>`;
            } else {
                for (let storeKey in ordersByStore) {
                    let badgeClass = storeKey.includes("葷食") ? "badge-meat" : "badge-veg";
                    html += `<p style="margin:5px 0;"><span class="${badgeClass}">${storeKey}</span></p><ul>`;
                    let items = ordersByStore[storeKey];
                    for (let item in items) {
                        let data = items[item];
                        let subtotal = data.unitPrice * data.totalQty;
                        html += `<li><b>${item}</b> x 總計 ${data.totalQty} 份 （小計：$${subtotal}元） <span style="color:#e67e22; font-size:11px;">[明細: ${data.details.join(', ')}]</span></li>`;
                    }
                    html += `</ul>`;
                }
                html += `<p style="font-weight:bold; color:#2c3e50;">當日總金額：$${dayTotal} 元</p>`;
                grandTotalAll += dayTotal;
            }
        });

        html += `<hr style="margin: 15px 0;">`;
        html += `<h3 style="color: #e74c3c;">💰 本週全體總收費金額：$ ${grandTotalAll} 元</h3>`;
        
        html += `<h4>👤 個人應繳金額明細（收錢用）：</h4><ul>`;
        allUsers.forEach(userName => {
            let userTotal = 0;
            let details = [];
            days.forEach(day => {
                let info = weeklySchedule[day];
                let order = userOrders[userName][day];
                if(order) {
                    userTotal += order.price;
                    let noodlePart = (order.noodle && order.noodle !== "無(非麵食)") ? `(${order.noodle})` : "";
                    let notePart = order.note ? `[${order.note}]` : "";
                    details.push(`${info.label}: ${order.itemName}${noodlePart} x ${order.qty}${notePart} $${order.price}`);
                }
            });
            html += `<li><b>${userName}</b>：共 $<b>${userTotal}</b> 元 <span style="font-size:12px; color:#666;">(${details.join(', ')})</span></li>`;
        });
        html += `</ul>`;

        summaryDiv.innerHTML = html;
    }

    window.onload = function() {
        initTable();
        renderSummary();
    };
</script>
